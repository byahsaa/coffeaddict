<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Addict</title>
<meta name="theme-color" content="#070605">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="page-style">
:root{
  color-scheme: dark;
  --ceiling:#070605;
  --ink:#0d0b0a;
  --coal:#141110;
  --walnut-dk:#1b1512;
  --paper:#ece5d8;
  --paper-2:#f6f1e7;
  --cream:#efe7da;
  --muted:#b3a794;
  --ink-soft:#5c5146;
  --sun:#c28d42;
  --sun-hi:#e3b566;
  --mirror:#c42a1e;
  --ok:#7fbf6a;
  --neon:#fffaf0;
  --mono:'Manrope', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --code:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --display:'Unbounded', 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
  --gutter: clamp(16px, 5vw, 80px);
  --hdr: 64px;
  --tabbar: 0px;
}
@media (max-width:760px){ :root{ --tabbar: 64px; } }
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--coal);color:var(--cream);font-family:var(--mono);font-size:16px;line-height:1.5;overflow-x:hidden;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--sun-hi);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
p,ul{margin:0}
[hidden]{display:none!important}
.wrap{position:relative;z-index:2;padding-inline:var(--gutter)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- пилюли ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:100px;font:800 14px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;border:1px solid var(--cream);background:transparent;color:var(--cream);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.pill:active{transform:scale(.97)}
.pill--solid{background:var(--cream);color:var(--ink)}
.pill--dark{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.pill--red{background:var(--mirror);border-color:var(--mirror);color:#fff}
.pill--wide{width:100%}

.mark{display:block;flex:none}
.word{font-family:var(--display);font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1}

/* ---------- шапка ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(7,6,5,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,250,240,.08)}
.top__row{display:flex;align-items:center;gap:12px;min-height:var(--hdr)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--cream);margin-right:auto}
.brand .mark{color:var(--cream)}
.brand .word{font-size:16px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.open i{background:var(--ok);box-shadow:0 0 0 4px rgba(127,191,106,.18)}
.status.open b{color:var(--cream)}
.top__nav{display:flex;gap:8px;align-items:center}
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:100px;border:0;background:var(--cream);color:var(--ink);font:700 14px/1 var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.cartbtn svg{width:20px;height:20px}
@media (max-width:760px){
  .top__nav{display:none}
  .brand .word{font-size:14px}
}
@media (max-width:380px){ .brand .word{display:none} }

/* ---------- нижняя панель (телефон) ---------- */
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(7,6,5,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,250,240,.1);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a,.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;border:0;background:transparent;color:var(--muted);text-decoration:none;font:500 11px/1 var(--mono);letter-spacing:.04em;cursor:pointer}
  .tabbar svg{width:24px;height:24px}
  .tabbar .on{color:var(--cream)}
  .tabbar .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:100px;background:var(--mirror);color:#fff;font:700 11px/20px var(--mono);text-align:center}
}

/* ---------- плавающая корзина ---------- */
.cartbar{position:fixed;z-index:44;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 10px 0 20px;border-radius:100px;border:0;background:var(--cream);color:var(--ink);font:700 15px/1 var(--mono);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);font-variant-numeric:tabular-nums;animation:pop .3s ease-out}
.cartbar__go{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-radius:100px;background:var(--ink);color:var(--cream);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}

/* ---------- секции + пятна ---------- */
.band{position:relative;overflow:hidden;overflow:clip}
.spill{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- фирменная лента ---------- */
.tape{position:absolute;z-index:1;height:22px;background:#050404;color:#e9e2d6;display:flex;align-items:center;white-space:nowrap;overflow:hidden;transform-origin:0 50%;pointer-events:none}
.tape span{display:inline-flex;align-items:center;gap:6px;padding-right:18px;font:italic 900 10px/1 var(--display);letter-spacing:.06em}
.tape svg{width:10px;height:10px}
.tape--top{top:12px;left:-5%;width:110%;transform:rotate(-1deg)}
.tape--bot{bottom:14px;left:-5%;width:110%;transform:rotate(1deg)}
.tape--ceil{top:150px;left:-10%;width:120%;transform:rotate(4deg)}
.tape.dsk{display:none}
@media (min-width:1200px){ .tape.dsk{display:flex} }

/* ---------- HERO ---------- */
.hero{background:linear-gradient(var(--ceiling) 0 110px, var(--coal) 300px);padding-block:clamp(250px,30vw,360px) clamp(56px,8vw,110px)}
.neon{position:absolute;left:0;top:14px;width:100%;height:200px;z-index:1;pointer-events:none}
.neon path{fill:none;stroke:var(--neon);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s .2s cubic-bezier(.6,.1,.3,1) forwards, hum 4s 3.4s ease-in-out infinite}
.neon .halo{stroke:#fff3d6;stroke-width:16;opacity:.28;filter:blur(6px)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hum{0%,100%{opacity:1}50%{opacity:.82}}
.arches{position:absolute;left:50%;top:190px;transform:translateX(-50%);width:min(560px,78vw);height:auto;z-index:1;pointer-events:none}
.lamp{position:absolute;top:0;z-index:1;overflow:visible;transform-origin:50% 0;animation:sway 6s ease-in-out infinite;pointer-events:none}
.lamp:nth-of-type(2n){animation-duration:7.4s;animation-delay:-2s}
.lamp:nth-of-type(3n){animation-duration:5.2s;animation-delay:-3.5s}
.lamp__glow{animation:flicker 5s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.85}45%{opacity:1}50%{opacity:.75}55%{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@media (max-width:760px){
  .lamp{transform-origin:50% 0;scale:.62}
  .lamp.dsk{display:none}
  .arches{top:170px}
}
.hero__inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.hero .mark{width:clamp(64px,9vw,104px);color:var(--cream)}
.hero .word{font-size:clamp(28px,6.6vw,96px);letter-spacing:-.01em}
.motto{font-size:clamp(16px,2vw,22px);color:var(--sun-hi);font-style:italic}
.hero__cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
@media (max-width:760px){ .hero__cta .pill{flex:1 1 220px} }
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(760px,100%);margin-top:6px}
.fact{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:18px;background:rgba(7,6,5,.72);border:1px solid rgba(239,231,218,.14);text-align:left;text-decoration:none;color:var(--cream)}
.fact small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fact b{font-size:15px;font-weight:500}
@media (max-width:560px){ .facts{grid-template-columns:1fr} .fact{flex-direction:row;justify-content:space-between;align-items:center} }
.perks{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(820px,100%)}
.perks li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(7,6,5,.78);border:1px solid rgba(239,231,218,.14);text-align:left;font-size:14px;font-weight:600;line-height:1.25}
.perks svg{width:34px;height:34px;flex:none;color:var(--cream)}
@media (max-width:760px){ .perks{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- заголовки секций ---------- */
.head{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--code);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--sun-hi)}
.h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.4vw,52px);line-height:1.12;letter-spacing:-.01em}
.squiggle{width:150px;height:24px;overflow:visible}
.squiggle path{fill:none;stroke:var(--neon);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,243,214,.7))}
.lead{max-width:60ch;color:#d3c7b4;font-size:16px;line-height:1.6}

/* ---------- МЕНЮ ---------- */
.menu{background:var(--walnut-dk);padding-block:clamp(52px,8vw,110px)}
.menu .head{margin-bottom:14px}
@media (max-width:760px){ .menu .h2{font-size:24px} }
.catbar{gap:8px!important;position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));z-index:30;margin-inline:calc(var(--gutter) * -1);padding:10px var(--gutter);background:rgba(27,21,18,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(239,231,218,.08);display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.search{position:relative}
.search input{width:100%;min-height:44px;padding:0 44px 0 44px;border-radius:100px;border:1px solid rgba(239,231,218,.25);background:#120e0c;color:var(--cream);font:16px var(--mono)}
.search input::placeholder{color:#8c8072}
.search svg{position:absolute;left:15px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;margin-inline:calc(var(--gutter) * -1);padding-inline:var(--gutter)}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:100px;border:1px solid rgba(239,231,218,.3);color:var(--cream);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.cats a.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(var(--hdr) + var(--sbar, 64px) + 10px);max-height:calc(100vh - var(--hdr) - var(--sbar, 64px) - var(--tabbar) - 90px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;display:flex;flex-direction:column;gap:2px;padding:8px;border-radius:18px;background:rgba(7,6,5,.82);border:1px solid rgba(239,231,218,.12)}
.rail::-webkit-scrollbar{display:none}
.rail__h{font-family:var(--code);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--sun-hi);padding:12px 10px 4px}
.rail__h:first-child{padding-top:4px}
.rail a{position:relative;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:44px;padding:8px 10px;border-radius:12px;color:var(--cream);text-decoration:none;font-size:14px;font-weight:600;line-height:1.2;transition:background .2s,color .2s}
.rail a.on{background:var(--cream);color:var(--ink)}
.rail a i{font-style:normal;min-width:20px;height:20px;padding:0 5px;border-radius:100px;background:var(--mirror);color:#fff;font-size:11px;font-weight:800;line-height:20px;text-align:center}
.catbar__row{display:flex;align-items:center;gap:8px}
.sbtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(239,231,218,.35);background:transparent;color:var(--cream);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sbtn svg{width:18px;height:18px}
.catbar .cats{flex:1;min-width:0;margin:0;padding:0 var(--gutter) 0 0;gap:6px;margin-right:calc(var(--gutter) * -1)}
.catbar .cats a{position:relative;min-height:36px;padding:0 12px;font-size:13px;gap:6px}
.cats a i{font-style:normal;min-width:18px;height:18px;padding:0 4px;border-radius:100px;background:var(--mirror);color:#fff;font-size:10px;font-weight:800;line-height:18px;text-align:center}
.cats .sep{flex:none;align-self:center;width:1px;height:22px;background:rgba(239,231,218,.3);margin:0 2px}
.paper{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 16px 6px;margin-bottom:16px}
.paper__h{font-family:var(--display);font-weight:900;font-size:clamp(26px,6vw,44px);text-transform:uppercase;text-align:center;letter-spacing:.02em;line-height:1;margin-bottom:14px}
.mcols{columns:2;column-gap:20px}
@media (min-width:1200px){ .mcols{columns:3;column-gap:32px} }
.cat h4{margin:0;font-family:var(--display);font-weight:700;font-size:15px;text-align:center;line-height:1.2}
.uline{display:block;width:64px;height:8px;margin:3px auto 4px}
.uline path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.item__txt{grid-area:txt;min-width:0;display:flex;flex-direction:column;gap:1px}
.item__dots{display:none}
.item .item__price{grid-area:price}
.item__ctl{grid-area:ctl;justify-self:end;align-self:center}
.item .item__price{justify-self:start}
@media (min-width:900px){
  .item{display:flex!important;align-items:center;gap:8px}
  .item__txt{flex:0 1 auto}
  .item__dots{display:block;flex:1;min-width:12px;border-bottom:1px dotted rgba(13,11,10,.45);transform:translateY(4px)}
}
@media (max-width:760px){
  .paper{padding:14px 10px 4px;border-radius:16px}
  .mcols{column-gap:12px}
  .cat h4{font-size:13px}
}
.list{min-width:0;max-width:880px}
@media (max-width:760px){
  .split{grid-template-columns:100px minmax(0,1fr);gap:10px;margin-inline:calc(var(--gutter) * -1 + 8px)}
  .rail{padding:6px;border-radius:14px}
  .rail__h{font-size:9px;letter-spacing:.14em;padding:10px 6px 2px}
  .rail a{font-size:13px;padding:8px 8px;min-height:44px}
  .rail a i{position:absolute;top:3px;right:3px;min-width:18px;height:18px;line-height:18px;font-size:10px;padding:0 4px}
  .split .cat{padding:10px 10px 4px}
  .split .cat h3{font-size:15px}
  .split .item{min-height:48px;gap:8px}
  .split .item__row{flex-direction:column;align-items:flex-start;gap:0}
  .split .item__name{flex:none;font-size:15px}
  .split .item__price{font-size:14px}
  .split .item__sub{font-size:12px}
  .split .plus{width:40px;height:40px}
}
.cat{break-inside:avoid;display:flex;flex-direction:column;margin-bottom:14px;scroll-margin-top:calc(var(--hdr) + var(--sbar, 64px) + 12px)}
.cat h3{font-family:var(--display);font-weight:700;font-size:17px;padding:2px 2px 6px;border-bottom:2px solid var(--ink)}
.items{list-style:none;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"txt ctl" "price ctl";align-items:center;column-gap:8px;row-gap:1px;padding:7px 0;border-top:1px dotted rgba(13,11,10,.25)}
.item:first-child{border-top:0}
.item__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item__row{display:flex;align-items:baseline;gap:10px}
.item__name{font-size:14px;line-height:1.25;font-weight:700}
@media (min-width:900px){ .item__name{font-size:15px} }
.item__price{flex:none;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item__price small{font-weight:500;color:var(--ink-soft);font-size:13px}
.item__sub{font-size:12px;color:var(--ink-soft);line-height:1.3}
.new{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:100px;background:var(--mirror);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;vertical-align:2px}
.addon{padding:4px 0}
.addon .item__name,.addon .item__price{font-weight:500;color:var(--ink-soft);font-size:14px}
.plus{flex:none;width:36px;height:36px;font-size:22px!important;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font:500 26px/1 var(--mono);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .15s}
.plus:active{transform:scale(.9)}
.plus .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:100px;background:var(--mirror);color:#fff;font:700 11px/20px var(--mono)}
.step{flex:none;display:flex;align-items:center;border-radius:100px;background:var(--ink);color:var(--paper);height:36px}
.step button{width:32px;height:36px;border:0;background:transparent;color:var(--paper);font:500 22px/1 var(--mono);cursor:pointer}
.step output{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cat__note{font-size:11px;color:var(--ink-soft);line-height:1.4;padding:2px 2px 6px}
.empty{padding:28px 20px;border-radius:20px;background:rgba(239,231,218,.06);color:var(--muted);text-align:center}

/* ---------- ЗАЛ ---------- */
.sunroom{background:var(--sun);color:var(--ink);padding-block:clamp(64px,9vw,130px);isolation:isolate}
.window{position:absolute;z-index:1;right:-4%;top:6%;width:min(760px,90vw);height:620px;pointer-events:none;transform:skewX(-14deg) rotate(-4deg);animation:sunmove 26s ease-in-out infinite alternate;filter:blur(3px);opacity:.9}
.window i{position:absolute;background:rgba(255,226,160,.62);mix-blend-mode:screen}
.sunroom .spill{z-index:0}
.sunroom .window{z-index:1;opacity:1}
@keyframes sunmove{from{transform:skewX(-14deg) rotate(-4deg) translateX(0)}to{transform:skewX(-10deg) rotate(-3deg) translateX(-50px)}}
.sunroom__grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,6vw,80px);align-items:start}
@media (max-width:900px){.sunroom__grid{grid-template-columns:1fr}}
.sunroom .eyebrow{color:var(--ink)}
.sunroom .lead{color:#2b1e0f}
.sunroom .squiggle path{stroke:var(--ink);filter:none}
.decor{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.decor li{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:rgba(13,11,10,.1);font-size:14px}
.decor svg{width:30px;height:30px;flex:none}
.pendant{position:relative;height:560px}
.pendant svg{position:absolute;top:-160px;left:calc(50% - 100px);width:200px;height:640px;overflow:visible}
.pendant .real{transform-origin:50% 0;animation:lampSway 7s ease-in-out infinite}
.pendant .shadow-wrap{position:absolute;inset:0;transform:translate(-110px,80px) skewX(-20deg);filter:blur(4px);opacity:.42;pointer-events:none}
.pendant .shadow{transform-origin:50% 0;animation:shadowSway 7s ease-in-out infinite}
@keyframes lampSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes shadowSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@media (max-width:900px){

/* ---------- КОНТАКТЫ ---------- */
.contacts{background:#0e0c0b;padding-block:clamp(64px,9vw,120px)}

.mirror p{margin:0;font-size:clamp(12px,1.4vw,15px);line-height:1.35;color:var(--ink)}

.contact-list{display:flex;flex-direction:column}

.contact-row span:first-child{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.contact-row a{text-underline-offset:4px}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}

/* ---------- лента и подвал ---------- */
.marquee{background:#050404;color:var(--cream);overflow:hidden;height:54px;display:flex;align-items:center}
.marquee__track{display:flex;flex:none;white-space:nowrap;animation:marquee 36s linear infinite}
.marquee__track span{display:inline-flex;align-items:center;gap:12px;padding-right:28px;font:italic 900 16px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.marquee__track svg{width:16px;height:16px}
@keyframes marquee{to{transform:translateX(-50%)}}
.foot{background:#050404;color:var(--muted);font-size:13px;padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}

/* ---------- выдвижные панели ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;z-index:81;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--paper-2);color:var(--ink);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}

@media (min-width:761px){
  .sheet{left:auto;right:24px;bottom:24px;width:420px;border-radius:24px;max-height:min(86vh,760px);animation:fade .2s ease-out}
}
.sheet__grab{width:44px;height:5px;border-radius:5px;background:rgba(13,11,10,.2);margin:10px auto 0}

.sheet__head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px 12px 20px;border-bottom:1px solid rgba(13,11,10,.1)}
.sheet__head h3{font-family:var(--display);font-size:18px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(13,11,10,.25);background:transparent;color:var(--ink);font:500 22px/1 var(--mono);cursor:pointer}
.sheet__body{overflow:auto;padding:14px 20px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sheet__foot{padding:14px 20px 18px;border-top:1px solid rgba(13,11,10,.1);display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 20px;border-radius:16px;border:1px solid rgba(13,11,10,.25);background:#fff;color:var(--ink);font:500 16px/1 var(--mono);cursor:pointer;font-variant-numeric:tabular-nums}
.opt:active{background:var(--ink);color:var(--paper)}
.line{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding-block:10px;border-bottom:1px dotted rgba(13,11,10,.2)}
.line__name{font-size:15px;line-height:1.3}

.field{display:flex;flex-direction:column;gap:6px}
.field > span, .field legend{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);padding:0}
fieldset.field{border:0;margin:0;padding:0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:4px;border-radius:100px;background:rgba(13,11,10,.08)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:100px;font-size:14px;cursor:pointer}
.seg input:checked + span{background:var(--ink);color:var(--paper)}
.seg input:focus-visible + span{outline:2px solid var(--sun);outline-offset:2px}
.field select,.field input,.field textarea{width:100%;min-height:48px;padding:10px 16px;border-radius:14px;border:1px solid rgba(13,11,10,.25);background:#fff;color:var(--ink);font:16px var(--mono)}
.field textarea{min-height:72px;resize:vertical}
.err{color:#a3261b;font-size:13px;min-height:1em}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.small{color:var(--ink-soft);font-size:12px;line-height:1.4}
.warn{padding:10px 14px;border-radius:14px;background:#f3dfd9;color:#7a1d14;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 82px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:90;background:var(--ink);color:var(--cream);border:1px solid rgba(239,231,218,.2);padding:10px 18px;border-radius:100px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion:reduce){

/* ---------- подвал ---------- */
.foot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.owner-link{background:none;border:1px solid rgba(239,231,218,.3);color:var(--cream);border-radius:100px;min-height:42px;padding:0 16px;font:700 13px var(--mono);cursor:pointer}

/* ---------- режим владельца ---------- */
.admin{position:fixed;inset:0;z-index:95;background:var(--paper-2);color:var(--ink);display:flex;flex-direction:column;animation:fade .2s ease-out}
.admin__head{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(13,11,10,.12)}

.admin__tools input{flex:1;min-width:0;min-height:42px;padding:0 16px;border-radius:100px;border:1px solid rgba(13,11,10,.25);background:#fff;color:var(--ink);font:16px var(--mono)}
.admin__body{flex:1;overflow:auto;overscroll-behavior:contain;padding:10px 16px 20px}
.admin__foot{display:flex;flex-direction:column;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(13,11,10,.12)}

.admin__status{font-size:13px;line-height:1.4;min-height:1.4em}
.admin .pill{border-color:rgba(13,11,10,.3);color:var(--ink)}
.admin .pill--dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.admin .pill[disabled]{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font:600 13px var(--mono);min-height:36px;cursor:pointer}
.adm-cat{border:1px solid rgba(13,11,10,.14);border-radius:14px;margin-bottom:10px;background:#fff}
.adm-cat summary{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;padding:0 14px;font-weight:800;font-size:15px;cursor:pointer;list-style:none}
.adm-cat summary::-webkit-details-marker{display:none}
.adm-cat summary small{font-weight:500;font-size:12px;color:var(--ink-soft)}
.adm-cat summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin:0 4px 4px 0;flex:none}

.adm-cat summary span{flex:1}
.adm-list{display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
.adm-item{display:grid;gap:8px;padding-top:10px;border-top:1px dashed rgba(13,11,10,.18)}

.adm-item input[type=text]{width:100%;min-height:42px;padding:6px 12px;border-radius:10px;border:1px solid rgba(13,11,10,.22);background:#fbf9f5;color:var(--ink);font:16px var(--mono)}

<script id="app-script">
(function(){
  // разметка страницы хранится в <template id="page-body">, чтобы режим владельца мог пересобрать страницу
  var tpl = document.getElementById('page-body');
  if (tpl && !document.getElementById('hdr')) tpl.parentNode.insertBefore(tpl.content.cloneNode(true), tpl);
  var WA = '77018359028';
  // ================= МЕНЮ =================
  // Данные меню лежат в блоке <script id="menu-data">. Их меняет «Режим владельца».
  // p: цены; v: подписи вариантов; nw: плашка NEW; add: добавка; off: нет в наличии
  var MENU_SRC = document.getElementById('menu-data').textContent;
  var MENU = JSON.parse(MENU_SRC);
  var DRAFT_KEY = 'ca-menu-draft-v1', usingDraft = false;
  function hashStr(str){ var h = 0; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return String(h); }
  try {
    var saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (saved && saved.base === hashStr(MENU_SRC) && Array.isArray(saved.menu)) { MENU = saved.menu; usingDraft = true; }
    else if (saved) localStorage.removeItem(DRAFT_KEY);
  } catch (e) {}
  // подписи объёмов для позиций с несколькими ценами без названий вариантов
  var SIZE2 = ['обычный','большой'], SIZE3 = ['маленький','средний','большой'];

  function fmt(n){ return n.toLocaleString('ru-RU').replace(/ /g,' ') + ' ₸'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function plural(n, a, b, c){ var m = n % 10, h = n % 100; return (m === 1 && h !== 11) ? a : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? b : c; }

  var ITEMS = {};
  var cols = document.getElementById('menuCols'), cats = document.getElementById('cats');
  var FOOD = { breakfast:1, croissant:1, sandwich:1, bakery:1, syrniki:1 };
  var NARROW = window.matchMedia('(max-width: 760px)'), WIDE = window.matchMedia('(min-width: 1200px)');
  function labelsFor(it){
    return it.p.map(function(pr, k){
      var label = (it.v && it.v[k]) ? it.v[k] : (it.p.length === 2 ? SIZE2[k] : it.p.length === 3 ? SIZE3[k] : it.p.length > 3 ? 'вариант ' + (k + 1) : '');
      return { label: label, price: pr };
    });
  }
  function prep(){
    ITEMS = {};
    MENU.forEach(function(cat){ cat.items.forEach(function(it){ it.opts = labelsFor(it); ITEMS[it.id] = it; }); });
  }
  function chips(food){ return MENU.filter(function(c){ return !!FOOD[c.id] === food; }).map(function(c){ return '<a href="#cat-' + c.id + '" data-cat="' + c.id + '"><span>' + esc(c.t) + '</span><i hidden></i></a>'; }).join(''); }
  function catHtml(cat){
    var seenAddon = false;
    return '<section class="cat" id="cat-' + cat.id + '" data-cat="' + cat.id + '"><h4>' + esc(cat.t) + '</h4><svg class="uline" viewBox="0 0 64 8" aria-hidden="true"><path d="M2 5 C16 1 30 8 62 3"/></svg><ul class="items">' +
      cat.items.map(function(it){
        var min = Math.min.apply(null, it.p), multi = it.opts.length > 1;
        var priceTxt = multi && it.p.some(function(x){ return x !== it.p[0]; }) ? '<small>от </small>' + fmt(min) : fmt(min);
        var sub = (it.v && it.v.length) ? it.v.join(' · ') : (multi ? it.opts.length + ' ' + plural(it.opts.length, 'объём', 'объёма', 'объёмов') : '');
        var addonHead = (it.add && !seenAddon) ? '<li class="addon-h">Добавки</li>' : ''; if (it.add) seenAddon = true;
        return addonHead + '<li class="item' + (it.add ? ' addon' : '') + (it.off ? ' is-off' : '') + '" data-key="' + it.id + '" data-search="' + esc((it.n + ' ' + (it.v || []).join(' ') + ' ' + cat.t).toLowerCase()) + '">' +
          '<div class="item__txt"><span class="item__name">' + esc(it.n) + '</span>' + (sub ? '<span class="item__sub">' + esc(sub) + '</span>' : '') + '</div>' +
          '<span class="item__dots" aria-hidden="true"></span><span class="item__price">' + priceTxt + (it.nw ? '<span class="new">NEW</span>' : '') + '</span><span class="item__ctl"></span></li>';
      }).join('') + '</ul>' +
      (cat.notes ? cat.notes.map(function(n){ return '<p class="cat__note">* ' + esc(n) + '</p>'; }).join('') : '') + '</section>';
  }
  function renderMenu(){
    prep();
    cats.innerHTML = chips(false) + '<span class="sep" aria-hidden="true"></span>' + chips(true);
    var n = WIDE.matches ? 3 : 2;
    cols.innerHTML = [['Напитки', false], ['Еда', true]].map(function(g){
      // раскладываем категории по колонкам так, чтобы колонки были примерно одной высоты
      var colsH = [], colsHtml = [];
      for (var k = 0; k < n; k++){ colsH.push(0); colsHtml.push(''); }
      MENU.filter(function(c){ return !!FOOD[c.id] === g[1]; }).forEach(function(c){
        var w = 2.2 + (c.notes ? c.notes.length * 1.1 : 0);
        c.items.forEach(function(it){ w += it.add ? .75 : 1 + (it.n.length > 16 ? .6 : 0) + ((it.v && it.v.length) || it.p.length > 1 ? .4 : 0); });
        var min = 0; for (var j = 1; j < n; j++) if (colsH[j] < colsH[min] - .01) min = j;
        colsH[min] += w; colsHtml[min] += catHtml(c);
      });
      return '<article class="paper"><h3 class="paper__h">' + g[0] + '</h3><div class="mcols">' + colsHtml.map(function(h){ return '<div class="mcol">' + h + '</div>'; }).join('') + '</div></article>';
    }).join('');
    cart = cart.filter(function(r){ var it = ITEMS[r.key]; return it && !it.off && it.p.indexOf(r.price) > -1; });
    document.getElementById('draftNote').hidden = !usingDraft;
    update();
    if (q.value) filter();
    requestAnimationFrame(rebuild);
  }

  // ================= корзина =================
  var cart = []; // {key, label, price, q}
  function lineName(r){ var it = ITEMS[r.key]; return it.n + (r.label ? ' (' + r.label + ')' : ''); }
  function qtyOf(key){ return cart.reduce(function(s, r){ return s + (r.key === key ? r.q : 0); }, 0); }
  function add(key, idx){
    var it = ITEMS[key]; if (!it || it.off) return;
    var o = it.opts[idx];
    var r = cart.find(function(x){ return x.key === key && x.label === o.label; });
    if (r) r.q++; else cart.push({ key: key, label: o.label, price: o.price, q: 1 });
    update(); toast('В заказе: ' + it.n.replace(/^\+\s*/, '') + (o.label ? ', ' + o.label : ''));
    if (navigator.vibrate) try { navigator.vibrate(12); } catch(e){}
  }
  function removeOne(key){
    for (var i = cart.length - 1; i >= 0; i--){ if (cart[i].key === key){ cart[i].q--; if (!cart[i].q) cart.splice(i, 1); break; } }
    update();
  }
  function renderCtl(li){
    var key = li.dataset.key, it = ITEMS[key], q = qtyOf(key), ctl = li.querySelector('.item__ctl');
    if (it.off){ ctl.innerHTML = '<span class="soldout">нет в<br>наличии</span>'; return; }
    if (!NARROW.matches && it.opts.length === 1 && q > 0){
      ctl.innerHTML = '<div class="step"><button type="button" data-act="dec" aria-label="Убрать одну: ' + esc(it.n) + '">−</button><output>' + q + '</output><button type="button" data-act="inc" aria-label="Добавить ещё: ' + esc(it.n) + '">+</button></div>';
    } else {
      ctl.innerHTML = '<button class="plus' + (q ? ' in' : '') + '" type="button" data-act="add" aria-label="Добавить: ' + esc(it.n) + (q ? ', в заказе ' + q : '') + '">+' + (q ? '<span class="n">' + q + '</span>' : '') + '</button>';
    }
  }
  function totals(){ var t = 0, n = 0; cart.forEach(function(r){ t += r.price * r.q; n += r.q; }); return { t: t, n: n }; }
  function update(){
    cols.querySelectorAll('.item').forEach(renderCtl);
    var s = totals();
    document.getElementById('hdrCount').textContent = s.n ? s.n + ' · ' + fmt(s.t) : '0';
    cats.querySelectorAll('a').forEach(function(a){
      var n = cart.reduce(function(t, r){ return t + (r.key.indexOf(a.dataset.cat + '-') === 0 ? r.q : 0); }, 0);
      var i = a.querySelector('i'); i.hidden = !n; i.textContent = n;
    });
    var badge = document.getElementById('tabBadge'); badge.hidden = !s.n; badge.textContent = s.n;
    var bar = document.getElementById('cartBar'); bar.hidden = !s.n || !cartEl.hidden;
    document.getElementById('cartBarText').textContent = s.n + ' ' + plural(s.n, 'позиция', 'позиции', 'позиций') + ' · ' + fmt(s.t);
    renderCart();
  }
  cols.addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var key = b.closest('.item').dataset.key, it = ITEMS[key];
    if (!it) return;
    if (b.dataset.act === 'dec') return removeOne(key);
    if (it.opts.length > 1) return openPick(key);
    add(key, 0);
  });

  // ---- выбор варианта
  var pick = document.getElementById('pick'), pickScrim = document.getElementById('pickScrim'), lastFocus = null;
  function openSheet(sheet, scrim){ toastEl.classList.remove('show'); lastFocus = document.activeElement; sheet.hidden = false; scrim.hidden = false; document.body.classList.add('locked'); var f = sheet.querySelector('button, a, input, select'); if (f) f.focus(); }
  function closeSheet(sheet, scrim){ sheet.hidden = true; scrim.hidden = true; if (pick.hidden && cartEl.hidden) document.body.classList.remove('locked'); update(); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function openPick(key){
    var it = ITEMS[key];
    document.getElementById('pickTitle').textContent = it.n;
    document.getElementById('pickOpts').innerHTML = it.opts.map(function(o, i){
      return '<button class="opt" type="button" data-i="' + i + '"><span>' + (o.label ? o.label.charAt(0).toUpperCase() + o.label.slice(1) : 'Стандарт') + '</span><b>' + fmt(o.price) + '</b></button>';
    }).join('');
    pick.dataset.key = key;
    openSheet(pick, pickScrim);
  }
  document.getElementById('pickOpts').addEventListener('click', function(e){
    var b = e.target.closest('.opt'); if (!b) return;
    add(pick.dataset.key, +b.dataset.i); closeSheet(pick, pickScrim);
  });
  pickScrim.addEventListener('click', function(){ closeSheet(pick, pickScrim); });

  // ---- корзина
  var cartEl = document.getElementById('cart'), cartScrim = document.getElementById('cartScrim');
  function openCart(){ buildTimes(); openSheet(cartEl, cartScrim); document.getElementById('cartBar').hidden = true; }
  document.querySelectorAll('[data-open-cart]').forEach(function(b){ b.addEventListener('click', openCart); });
  cartScrim.addEventListener('click', function(){ closeSheet(cartEl, cartScrim); });
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', function(){ var s = b.closest('.sheet'); closeSheet(s, s === pick ? pickScrim : cartScrim); }); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ if (!pick.hidden) closeSheet(pick, pickScrim); else if (!cartEl.hidden) closeSheet(cartEl, cartScrim); } });

  function renderCart(){
    var box = document.getElementById('cartLines'), s = totals();
    document.getElementById('orderForm').hidden = !cart.length;
    document.getElementById('waOrder').hidden = !cart.length;
    if (!cart.length){
      box.innerHTML = '<p class="small" style="font-size:15px;padding:12px 0">Корзина пустая. Откройте меню и нажмите «+» у позиции.</p><a class="pill pill--dark pill--wide" href="#menu" data-close-go>Перейти в меню</a>';
    } else {
      box.innerHTML = cart.map(function(r, i){
        return '<div class="line"><span class="line__name">' + esc(lineName(r)) + '</span><span class="line__sum">' + fmt(r.price * r.q) + '</span><span class="line__unit">' + fmt(r.price) + ' за шт.</span>' +
          '<div class="step"><button type="button" data-i="' + i + '" data-d="-1" aria-label="Меньше">−</button><output>' + r.q + '</output><button type="button" data-i="' + i + '" data-d="1" aria-label="Больше">+</button></div></div>';
      }).join('');
    }
    document.getElementById('cartTotal').textContent = fmt(s.t);
    buildLink();
  }
  document.getElementById('cartLines').addEventListener('click', function(e){
    if (e.target.closest('[data-close-go]')) { closeSheet(cartEl, cartScrim); return; }
    var b = e.target.closest('button[data-i]'); if (!b) return;
    var r = cart[+b.dataset.i]; r.q += +b.dataset.d; if (r.q <= 0) cart.splice(+b.dataset.i, 1); update();
  });

  // ---- часы работы (время Астаны, UTC+5)
  function astana(){ var d = new Date(Date.now() + 5 * 3600e3); return { dow: d.getUTCDay(), min: d.getUTCHours() * 60 + d.getUTCMinutes() }; }
  function openAt(dow){ return (dow === 0 || dow === 6) ? 9 * 60 : 8 * 60; }
  var CLOSE = 21 * 60;
  function hhmm(m){ return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function status(){
    var a = astana(), o = openAt(a.dow), isOpen = a.min >= o && a.min < CLOSE;
    var el = document.getElementById('status');
    el.classList.toggle('open', isOpen);
    var txt;
    if (isOpen) txt = '<b>Открыто</b> до 21:00';
    else if (a.min < o) txt = 'Закрыто · откроемся в ' + hhmm(o);
    else txt = 'Закрыто · завтра с ' + hhmm(openAt((a.dow + 1) % 7));
    document.getElementById('statusText').innerHTML = txt;
    document.getElementById('todayHours').textContent = 'Сегодня ' + hhmm(o) + '–21:00';
    return { a: a, o: o, isOpen: isOpen };
  }
  function buildTimes(){
    var st = status(), sel = document.getElementById('when'), prev = sel.value, opts = [], warn = document.getElementById('closedWarn');
    var start, dayLabel = '';
    if (st.isOpen){ opts.push('Как можно скорее'); start = Math.ceil((st.a.min + 15) / 15) * 15; warn.hidden = true; }
    else if (st.a.min < st.o){ start = st.o + 15; warn.hidden = false; warn.textContent = 'Сейчас закрыто. Заказ можно сделать на время после открытия в ' + hhmm(st.o) + '.'; }
    else { var no = openAt((st.a.dow + 1) % 7); start = no + 15; dayLabel = 'завтра '; warn.hidden = false; warn.textContent = 'Сегодня уже закрыто. Можно заказать на завтра, с ' + hhmm(no) + '.'; }
    for (var m = start; m <= CLOSE - 15; m += 15) opts.push('к ' + dayLabel + hhmm(m));
    sel.innerHTML = opts.map(function(o){ return '<option' + (o === prev ? ' selected' : '') + '>' + o + '</option>'; }).join('');
    buildLink();
  }
  setInterval(status, 60000);

  // ---- ссылка на WhatsApp
  function buildLink(){
    var s = totals(), mode = document.querySelector('input[name="mode"]:checked').value;
    var lines = cart.map(function(r, i){ return (i + 1) + '. ' + lineName(r) + ' × ' + r.q + ' — ' + fmt(r.price * r.q); });
    var nm = document.getElementById('nm').value.trim(), cm = document.getElementById('cm').value.trim(), when = document.getElementById('when').value || '';
    var text = 'Здравствуйте! Заказ с сайта Coffee Addict:\n' + lines.join('\n') + '\n\nИтого: ' + fmt(s.t) + '\nПолучение: ' + mode.toLowerCase() + (when ? ', ' + when.toLowerCase() : '') + (nm ? '\nИмя: ' + nm : '') + (cm ? '\nКомментарий: ' + cm : '');
    document.getElementById('waOrder').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text);
  }
  ['nm','cm','when'].forEach(function(id){ document.getElementById(id).addEventListener('input', function(){ document.getElementById('formErr').textContent = ''; buildLink(); }); });
  document.querySelectorAll('input[name="mode"]').forEach(function(r){ r.addEventListener('change', buildLink); });
  document.getElementById('waOrder').addEventListener('click', function(e){
    if (!document.getElementById('nm').value.trim()){
      e.preventDefault();
      document.getElementById('formErr').textContent = 'Укажите имя, чтобы бариста знал, для кого заказ.';
      document.getElementById('nm').focus();
    }
  });

        else if (!c || c === 'upstream_error') admStatus('Не получилось опубликовать. Проверьте интернет и попробуйте ещё раз.');
        else { canPub = false; whereText(); applyLocal(menu); dirty = false; admStatus('Прав на публикацию нет, поэтому меню сохранено только на этом устройстве.'); }
      });
    } else {
      applyLocal(menu); dirty = false;
      admStatus(inClaude ? 'Сохранено на этом устройстве. Гости видят прежнее меню.' : 'Сохранено на этом устройстве. Скачайте файл, чтобы обновить сайт на хостинге.');
    }
  });
  document.getElementById('admCancel').addEventListener('click', function(){ draft = editable(MENU); dirty = false; renderAdmin(); admStatus('Изменения отменены.'); });
  document.getElementById('admClose').addEventListener('click', function(){ closeAdmin(false); });
  document.getElementById('admDownload').addEventListener('click', function(){
    if (!validate()){ admStatus('Проверьте позиции, отмеченные красным.'); return; }
    var blob = new Blob([buildDoc(cleanMenu(draft))], { type: 'text/html' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    admStatus('Файл index.html скачан. Замените им старый файл на хостинге.');
  });
  document.getElementById('ownerOpen').addEventListener('click', openAdmin);
  document.querySelectorAll('a[href="#top"]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }); });
  if (WIDE.addEventListener) WIDE.addEventListener('change', renderMenu); else if (WIDE.addListener) WIDE.addListener(renderMenu);
  document.getElementById('draftReset').addEventListener('click', function(){
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    MENU = JSON.parse(MENU_SRC); usingDraft = false; renderMenu(); toast('Показано исходное меню');
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !admin.hidden) closeAdmin(false); });
  window.addEventListener('hashchange', function(){ if (location.hash === '#owner' && admin.hidden) openAdmin(); });
  if (NARROW.addEventListener) NARROW.addEventListener('change', update); else if (NARROW.addListener) NARROW.addListener(update);

  status();
  renderMenu();
  rebuild();
  if (location.hash === '#owner') openAdmin();
  if (reduce) { intro = .16; req(); }
  else { var t0 = null; requestAnimationFrame(function step(t){ if (t0 === null) t0 = t; intro = .16 * Math.min(1, (t - t0) / 1800); req(); if (intro < .16) requestAnimationFrame(step); }); }
})();
</script>
